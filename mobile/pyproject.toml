[project]
name = "lgxt-assistant-mobile"
version = "3.3.2"
description = "LGXT Assistant · 理工学堂助手（Android / Flet）"
requires-python = ">=3.11"
dependencies = [
  "flet==1.1.2",
  "flet-secure-storage==1.1.2",
  "oauthlib>=4.0.0,<5",
  "Pillow==13.0.0",
  "requests>=2.32.5,<2.33; python_version < '3.10'",
  "requests>=2.34.2,<3; python_version >= '3.10'",
]

[tool.flet]
org = "io.github.styayur"
product = "LGXT Assistant"
company = "Styayur"
copyright = "AGPL-3.0-only (c) Styayur"
build_number = 6
bundle_id = "io.github.styayur.lgxt_assistant_mobile"

[tool.flet.app]
path = "src"

[tool.flet.android]
# Do not set usesCleartextTraffic globally. The working v3.2.0 APK had no
# cleartext flag; Python sockets are not governed by that manifest attribute.
# Do not disable HTTPS certificate validation.
permissions = ["android.permission.INTERNET"]

[tool.flet.android.manifest_application]
allowBackup = "false"
fullBackupContent = "false"
