name: Release Windows desktop channel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop release tag, for example v4.0.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact release tag
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Desktop tag must use vX.Y.Z: $tag" }
          git describe --exact-match --tags HEAD
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller playwright
          python -m playwright install chromium
      - name: Verify source before packaging
        run: python -m pytest -q
      - name: Build Windows applications
        shell: pwsh
        run: ./packaging/build_exe.ps1
      - name: Verify UI and packaged applications
        shell: pwsh
        run: |
          python scripts/check_frontend.py
          if ($LASTEXITCODE -ne 0) { throw 'UI checks failed' }
          python scripts/check_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged startup checks failed' }
      - name: Prepare channel-named release assets
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          $stage = Join-Path $env:RUNNER_TEMP ('LGXT-' + $tag)
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $desktop = Join-Path $stage "LGXT-Assistant-Windows-Desktop-$tag.exe"
          $portable = Join-Path $stage "LGXT-Assistant-Windows-Desktop-$tag-portable.zip"
          $guide = Join-Path $stage "LGXT-Assistant-Windows-Desktop-$tag-User-Guide.pdf"
          Copy-Item dist/LGXT-Assistant.exe $desktop
          Copy-Item dist/LGXT-Assistant-portable.zip $portable
          Copy-Item output/pdf/LGXT-Assistant-4.0.1-User-Guide.pdf $guide
          Get-ChildItem -LiteralPath $stage -File | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding utf8NoBOM (Join-Path $stage 'SHA256SUMS.txt')
          "ASSET_DIR=$stage" >> $env:GITHUB_ENV
      - name: Publish draft then promote verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          $target = git rev-parse HEAD
          gh release create $tag --draft --target $target --title "LGXT Assistant $tag · Windows Desktop" --notes-file docs/releases/v4.0.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are not overwritten' }
          gh release upload $tag "$env:ASSET_DIR/*"
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-verification
          path: |
            build/*-smoke.json
            docs/screenshots/modern-*.png
