name: Windows Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/version_info.txt
      - frontend/package-lock.json
      - .github/workflows/windows-release.yml

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller playwright
          python -m playwright install chromium
      - name: Verify Python behavior
        run: python -m pytest -q
      - name: Build Windows applications
        shell: pwsh
        run: ./packaging/build_exe.ps1
      - name: Verify UI and packaged applications
        run: |
          python scripts/check_frontend.py
          if ($LASTEXITCODE -ne 0) { throw 'UI checks failed' }
          python scripts/check_package.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged startup checks failed' }
      - name: Prepare release checksums
        shell: pwsh
        run: |
          Copy-Item output/pdf/LGXT-Assistant-4.0.1-User-Guide.pdf dist/
          $assets = @('LGXT-Assistant.exe', 'LGXT-Assistant-portable.zip', 'LGXT-Assistant-4.0.1-User-Guide.pdf')
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist/$asset").Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $lines | Set-Content -Encoding utf8NoBOM dist/SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = 'v4.0.1'
          gh release create $tag --draft --target $env:GITHUB_SHA --title 'LGXT Assistant 4.0.1 · 全新桌面与启动修复' --notes-file docs/releases/v4.0.1.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are not overwritten' }
          gh release upload $tag dist/LGXT-Assistant.exe dist/LGXT-Assistant-portable.zip dist/LGXT-Assistant-4.0.1-User-Guide.pdf dist/SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-verification
          path: |
            build/*-smoke.json
            docs/screenshots/modern-*.png
