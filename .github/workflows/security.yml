name: Security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pip-audit bandit
      - run: python -m pip_audit -r requirements.txt
      - run: python -m bandit -r desktop/bridge.py desktop/storage.py mobile/src tasks.py exporter.py web_app.py
      - run: npm ci && npm audit
        working-directory: frontend
  # Existing GitHub CodeQL default setup remains configured for Python/JS/Actions.
