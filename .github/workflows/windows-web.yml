name: Windows Web Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web_app.py
      - desktop/**
      - frontend/**
      - tests/test_web_app.py
      - scripts/check_web.py
      - packaging/build_web.ps1
      - .github/workflows/windows-web.yml
  pull_request:
    paths:
      - web_app.py
      - frontend/**
      - tests/test_web_app.py
      - scripts/check_web.py
      - packaging/build_web.ps1
      - .github/workflows/windows-web.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller playwright
          python -m playwright install chromium
      - name: Test Python
        run: python -m pytest -q
      - name: Build Windows browser application
        run: ./packaging/build_web.ps1
      - name: Verify packaged app in Chromium
        run: python scripts/check_web.py --exe dist/LGXT-Assistant-Web.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LGXT-Assistant-Windows-Web
          path: |
            dist/LGXT-Assistant-Web.exe
            docs/screenshots/windows-web.png
