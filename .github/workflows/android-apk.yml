name: Android APK

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: 'Optional existing candidate run: rerun native acceptance only (app/dependency source must match)'
        default: ''
      release_signing:
        description: 'Sign with the durable Beta identity (main only; tag is created after acceptance)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing request before accessing credentials
        env:
          RELEASE_SIGNING: ${{ inputs.release_signing }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          if [ "$RELEASE_SIGNING" = true ]; then
            test "$GITHUB_REF" = refs/heads/main
            test -z "$CANDIDATE_RUN"
          fi

  build-apk:
    needs: validate-request
    if: inputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure pinned Android SDK tools
        run: test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'

      - name: Build security-patched Android Pillow wheels
        run: |
          bash scripts/build_android_wheels.sh
          python scripts/check_android_wheels.py --directory build/android/wheels

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-wheel-evidence
          path: |
            build/android/wheels
            build/android/wheel-evidence
            ${{ runner.temp }}/lgxt-mobile-forge/errors

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install audited Flet toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'flet[cli]==1.0.5' 'oauthlib>=4.0.0,<5' pip-audit
          python -m pip_audit -r mobile/requirements.txt
          # SDK version is pinned to flet.version.flutter_version in Flet 1.0.5.

      - name: Build APK (Flet)
        working-directory: mobile
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/build/android/wheels
        run: flet build apk --verbose --yes --arch arm64-v8a x86_64

      - name: Collect APK
        run: |
          mkdir -p out
          version=$(python -c "import tomllib; print(tomllib.load(open('mobile/pyproject.toml','rb'))['project']['version'])")
          cp mobile/build/apk/lgxt-assistant-mobile.apk "out/LGXT-Assistant-Android-v${version}.apk"
          python scripts/check_android_metadata.py --apk "out/LGXT-Assistant-Android-v${version}.apk" --allow-debug-for-testing --source-commit "$GITHUB_SHA" --output out/APK-IDENTITY-TEST-ONLY.json
          python scripts/collect_android_notices.py --apk "out/LGXT-Assistant-Android-v${version}.apk" --output out/THIRD-PARTY.txt
          cp LICENSE NOTICE.md out/
          cp docs/android-beta.md out/ANDROID-GUIDE.md
          cd out
          sha256sum *.apk LICENSE NOTICE.md ANDROID-GUIDE.md THIRD-PARTY.txt APK-IDENTITY-TEST-ONLY.json > SHA256SUMS.txt
          ls -l .

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lgxt-android-apk
          path: out/*

      - name: Build separate synthetic acceptance APK
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/build/android/wheels
        run: |
          cp mobile/src/main.py mobile/src/app_under_test.py
          cp scripts/android_image_checks.py mobile/src/android_image_checks.py
          cp scripts/android_fixture_entry.py mobile/src/main.py
          cd mobile
          flet build apk --verbose --yes --arch x86_64
          mkdir -p ../fixture-out
          cp build/apk/*.apk ../fixture-out/LGXT-fixture-only.apk
      - uses: actions/upload-artifact@v7
        with:
          name: lgxt-fixture-only-apk
          path: fixture-out/*.apk

      # Candidate build artifacts are retained for review only. Production release
      # requires signing identity and device/emulator checks, not just flet build.

  sign-apk:
    needs: build-apk
    if: inputs.release_signing
    runs-on: ubuntu-latest
    environment: android-beta-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: lgxt-android-apk
          path: candidate
      - name: Ensure pinned Android SDK tools
        run: test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Sign and verify exact application payload
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
        run: python scripts/sign_android_apk.py --input candidate/LGXT-Assistant-Android-v3.3.0.apk --directory release-out --source-commit "$GITHUB_SHA"
      - name: Collect only release assets
        run: |
          cp candidate/LICENSE candidate/NOTICE.md candidate/ANDROID-GUIDE.md candidate/THIRD-PARTY.txt release-out/
          cd release-out
          sha256sum *.apk LICENSE NOTICE.md ANDROID-GUIDE.md THIRD-PARTY.txt APK-IDENTITY.json > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: lgxt-android-release-signed
          path: release-out/*

  emulator:
    needs: [validate-request, build-apk, sign-apk]
    if: >-
      always() && needs.validate-request.result == 'success' &&
      ((inputs.release_signing && needs.sign-apk.result == 'success') ||
      (!inputs.release_signing && (needs.build-apk.result == 'success' || inputs.candidate_run_id != '')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify reused candidate source
        if: inputs.candidate_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .head_sha)
          git fetch origin "$source"
          git diff --exit-code "$source" HEAD -- mobile/src mobile/pyproject.toml mobile/requirements.txt packaging/android scripts/build_android_wheels.sh scripts/android_fixture_entry.py scripts/android_image_checks.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.release_signing && 'lgxt-android-release-signed' || 'lgxt-android-apk' }}
          path: build/android/apk
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v7
        with:
          name: lgxt-fixture-only-apk
          path: build/android/fixture
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ensure pinned Android SDK tools
        run: test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;36.0.0'
      - name: Independently verify release APK before native acceptance
        if: inputs.release_signing
        run: |
          (cd build/android/apk && sha256sum --check SHA256SUMS.txt)
          certificate=$(python -c "import json;print(json.load(open('packaging/android/signing-identity.json'))['certificateSha256'])")
          python scripts/check_android_metadata.py --apk build/android/apk/LGXT-Assistant-Android-v3.3.0.apk --expected-certificate "$certificate" --source-commit "$GITHUB_SHA" --output build/android/ACCEPTANCE-IDENTITY.json
      - name: Obtain immutable historical APK for upgrade rejection test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v3.2.1 -p LGXT-Assistant-3.2.1-android.apk -D build/android/history
          echo '6a9ec5a4113a1a24a4bfad29068158544aa526f892ffa972b590d53a7e29487d  build/android/history/LGXT-Assistant-3.2.1-android.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            python scripts/check_android_device.py --apk build/android/apk/LGXT-Assistant-Android-v3.3.0.apk --historical-apk build/android/history/LGXT-Assistant-3.2.1-android.apk ${{ inputs.release_signing && '--backup-roundtrip' || '' }}
            adb uninstall io.github.styayur.lgxt_assistant_mobile
            python scripts/check_android_device.py --apk build/android/fixture/LGXT-fixture-only.apk --fixture --output build/android/device-fixture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-native-acceptance
          path: |
            build/android/device
            build/android/device-fixture
            build/android/ACCEPTANCE-IDENTITY.json
