name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-android'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install audited Flet toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'flet[cli]==1.0.5' 'oauthlib>=4.0.0,<5' pip-audit
          python -m pip_audit -r mobile/requirements.txt
          # Flet CLI selects its compatible Flutter SDK. Never publish solely on build success.

      - name: Build APK (Flet)
        working-directory: mobile
        run: flet build apk --verbose

      - name: Collect APK
        run: |
          mkdir -p out
          find mobile/build -name '*.apk' -print
          version=$(python -c "import tomllib; print(tomllib.load(open('mobile/pyproject.toml','rb'))['project']['version'])")
          cp $(find mobile/build -name '*.apk' | head -n 1) "out/LGXT-Assistant-Android-v${version}.apk"
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: lgxt-android-apk
          path: out/*.apk

      # Candidate build artifacts are retained for review only. Production release
      # requires signing identity and device/emulator checks, not just flet build.
