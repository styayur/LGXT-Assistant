name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter / Android toolchain info
        run: |
          flutter --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          python -m pip install flet==0.25.2

      - name: Build APK (Flet)
        working-directory: mobile
        run: flet build apk --verbose

      - name: Collect APK
        run: |
          mkdir -p out
          find mobile/build -name '*.apk' -print
          cp $(find mobile/build -name '*.apk' | head -n 1) out/LGXT-Assistant-3.1.0-android.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: lgxt-android-apk
          path: out/*.apk

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
