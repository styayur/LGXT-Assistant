name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest -q
      - name: Compile check
        run: python -m compileall -q default.pyw theme.py api.py config.py exporter.py tasks.py ui tests mobile/src/main.py
