name: Bug report
description: Report a reproducible LGXT Assistant problem.
title: '[Bug]: '
body:
  - type: dropdown
    id: channel
    attributes:
      label: Product channel
      options:
        - Windows desktop
        - Windows web
        - Android
        - Legacy Tk desktop
        - Source or packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and downloaded asset filename
      placeholder: v4.1.0-web / LGXT-Assistant-Web.exe
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and runtime
      placeholder: Windows 11 24H2; WebView2 141 / Android 14
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove platform passwords, AI API keys, student identifiers, private course data, local paths, and AI conversation content.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security check
      options:
        - label: I removed platform credentials, AI keys, private course data, and personal information from this report.
          required: true
        - label: This is not a security vulnerability. I will follow SECURITY.md for security reports.
          required: true
