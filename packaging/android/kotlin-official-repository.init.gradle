// Keep the existing plugin repositories. Only Kotlin artifacts also have their
// official Maven Central source, avoiding Plugin Portal redirect/cache failures.
gradle.beforeSettings { settings ->
    settings.pluginManagement.repositories.mavenCentral {
        content {
            includeGroup('org.jetbrains.kotlin')
            includeGroupByRegex('org[.]jetbrains[.]kotlin[.].*')
        }
    }
}
